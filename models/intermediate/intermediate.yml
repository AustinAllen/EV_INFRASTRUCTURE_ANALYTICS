version: 2

models:
  - name: int_ev_demand_by_tla
    description: "EV demand aggregated by TLA and year"
    columns:
      - name: tla_code
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: ev_count
        tests:
          - not_null

  - name: int_chargers_by_tla
    description: "Charging supply aggregated by TLA and year"
    columns:
      - name: tla_code
        tests:
          - not_null

      - name: year
        tests:
          - not_null

      - name: station_count
        tests:
          - not_null

  - name: int_ev_per_capita
    description: "ev aggreate by population"
    columns:
      - name: tla_code
        tests:
          - not_null

  - name: int_business_zone_classification
    description: "business_zone"
    columns:
      - name: tla_code
        tests:
          - not_null
          

  - name: int_chargers_by_tla_latest
    description: "charger by tla in latest"
    columns:
      - name: tla_code
        tests:
          - not_null